name: ROS 2 build and regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    timeout-minutes: 30
    env:
      UCON_BUILD_WORKERS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: ./scripts/install_dependencies.sh
      - name: Build all packages
        run: ./build.sh
      - name: Run headless regression tests
        run: ./scripts/test.sh
      - name: Show simulation diagnostics on failure
        if: failure()
        run: |
          if [ -f log/tests/simulation-smoke.log ]; then
            tail -n 150 log/tests/simulation-smoke.log
          fi
